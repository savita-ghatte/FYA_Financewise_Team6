<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EXPENSE TRACKER QUIZ</title>

    <!-- CSS -->
    <link rel="stylesheet" href="quiz.css">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body>

<div class="container">

    <div class="quiz-card">

        <h1>💰 EXPENSE TRACKER QUIZ</h1>

        <p class="subtitle">
            Test your EXPENSE TRACKER knowledge with 10 multiple-choice questions.
        </p>

        <!-- Progress -->
        <div class="progress-section">

            <div class="progress-text">
                <span id="question-number">Question 1 of 10</span>
            </div>

            <div class="progress-bar">
                <div id="progress"></div>
            </div>

        </div>

        <!-- Question -->
        <div class="question-box">

            <h2 id="question">
                Question will appear here
            </h2>

        </div>

        <!-- Options -->
        <div class="options">

            <label class="option">
                <input type="radio" name="answer" value="0">
                <span id="option0"></span>
            </label>

            <label class="option">
                <input type="radio" name="answer" value="1">
                <span id="option1"></span>
            </label>

            <label class="option">
                <input type="radio" name="answer" value="2">
                <span id="option2"></span>
            </label>

            <label class="option">
                <input type="radio" name="answer" value="3">
                <span id="option3"></span>
            </label>

        </div>

        <!-- Buttons -->
        <div class="buttons">

            <button id="prevBtn">
                <i class="fa-solid fa-arrow-left"></i>
                Previous
            </button>

            <button id="nextBtn">
                Next
                <i class="fa-solid fa-arrow-right"></i>
            </button>

            <button id="submitBtn">
                <i class="fa-solid fa-check"></i>
                Submit Quiz
            </button>

        </div>

    </div>

</div>

<!-- Result Popup -->

<div id="resultBox" class="result-box">

    <h2>🎉 Quiz Completed!</h2>

    <h1 id="score"></h1>

    <p id="percentage"></p>

    <p id="performance"></p>

    <button onclick="location.reload()">
        Retake Quiz
    </button>

</div>

<script src="expense.js"></script>

</body>
</html>
